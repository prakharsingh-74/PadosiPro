version: '3.8'

services:
  # Mailpit: Local SMTP Mail Catcher for OTP Emails
  mailpit:
    image: axllent/mailpit:latest
    container_name: padosipro_mailpit
    restart: always
    ports:
      - "8025:8025" # Mailpit Web UI (http://localhost:8025)
      - "1025:1025" # SMTP Server Port

  # Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padosipro_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET:-padosipro_super_secret_jwt_key_2026}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SECURE=false
      - FROM_EMAIL=noreply@padosipro.com
    depends_on:
      - mailpit
